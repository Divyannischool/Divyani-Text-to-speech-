<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groq Text to Speech</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #312e81);
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 650px;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,.3);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    p {
      text-align: center;
      color: #666;
    }

    textarea {
      width: 100%;
      height: 180px;
      resize: vertical;
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #6366f1;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    select,
    button {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 15px;
    }

    button {
      border: none;
      background: #4f46e5;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #4338ca;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    audio {
      width: 100%;
      margin-top: 20px;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .counter {
      text-align: right;
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🎙️ Groq Text to Speech</h1>
    <p>Convert your text into natural speech</p>

    <textarea
      id="text"
      maxlength="200"
      placeholder="Type your text here..."
    ></textarea>

    <div class="counter">
      <span id="count">0</span>/200
    </div>

    <div class="row">

      <select id="voice">
        <option value="troy">Troy</option>
        <option value="austin">Austin</option>
        <option value="hannah">Hannah</option>
      </select>

      <button id="generateBtn" onclick="generateSpeech()">
        🔊 Generate Speech
      </button>

    </div>

    <div id="status"></div>

    <audio id="audio" controls></audio>

  </div>


<script>

  // ⚠️ FOR TESTING ONLY
  // Never expose your real API key in a public website.
  const GROQ_API_KEY ="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


  const textBox = document.getElementById("text");
  const count = document.getElementById("count");

  textBox.addEventListener("input", () => {
    count.textContent = textBox.value.length;
  });


  async function generateSpeech() {

    const text = textBox.value.trim();
    const voice = document.getElementById("voice").value;

    const status = document.getElementById("status");
    const button = document.getElementById("generateBtn");
    const audio = document.getElementById("audio");


    if (!text) {
      status.textContent = "❌ Please enter some text.";
      return;
    }

    if (text.length > 200) {
      status.textContent = "❌ Maximum 200 characters allowed.";
      return;
    }


    button.disabled = true;
    button.textContent = "⏳ Generating...";
    status.textContent = "Generating speech...";


    try {

      const response = await fetch(
        "https://api.groq.com/openai/v1/audio/speech",
        {
          method: "POST",

          headers: {
            "Authorization": `Bearer ${GROQ_API_KEY}`,
            "Content-Type": "application/json"
          },

          body: JSON.stringify({

            model: "canopylabs/orpheus-v1-english",

            input: text,

            voice: voice,

            response_format: "wav"

          })
        }
      );


      if (!response.ok) {

        const errorText = await response.text();

        throw new Error(
          `API Error ${response.status}: ${errorText}`
        );
      }


      const audioBlob = await response.blob();

      const audioURL = URL.createObjectURL(audioBlob);

      audio.src = audioURL;

      audio.play();

      status.textContent = "✅ Speech generated successfully!";

    }

    catch (error) {

      console.error(error);

      status.textContent =
        "❌ Error: " + error.message;

    }

    finally {

      button.disabled = false;
      button.textContent = "🔊 Generate Speech";

    }

  }

</script>

</body>
  </html>
